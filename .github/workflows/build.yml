name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装构建依赖
        run: pip install pyinstaller pyusb

      - name: Linux 安装 tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: 计算版本号
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"        # tag v1.2.3 -> 1.2.3
          else
            VERSION="dev-${GITHUB_SHA::8}"        # 手动运行 -> dev-<短SHA>
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 打包 CLI + GUI（PyInstaller）
        run: |
          python -m PyInstaller --clean --noconfirm --name finger_tool_cli --console finger_tool_cli.py
          python -m PyInstaller --clean --noconfirm --name finger_tool_gui --windowed finger_tool_gui.py

      - name: 压缩产物
        shell: bash
        run: |
          cd dist
          echo "${{ steps.ver.outputs.version }}" > VERSION
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path finger_tool_cli,finger_tool_gui,VERSION -DestinationPath m200f-${{ matrix.name }}-${{ steps.ver.outputs.version }}.zip -Force"
          else
            zip -r m200f-${{ matrix.name }}-${{ steps.ver.outputs.version }}.zip finger_tool_cli finger_tool_gui VERSION
          fi

      - name: 上传到 GitHub Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/m200f-${{ matrix.name }}-${{ steps.ver.outputs.version }}.zip

      - name: 上传 Artifact（手动运行时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: m200f-${{ matrix.name }}-${{ steps.ver.outputs.version }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可证
        run: yes | sdkmanager --licenses

      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 注入 NanaHigh release 签名
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/NanaHigh.jks
          cat > android/signing.properties <<EOF
          storeFile=NanaHigh.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: 构建 Android debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: 构建 Android release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: gradle --no-daemon -p android assembleRelease

      - name: 上传 Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m200f-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/m200f-unlocker-*-debug.apk

      - name: 上传 Android Release 到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/m200f-unlocker-*-release.apk
