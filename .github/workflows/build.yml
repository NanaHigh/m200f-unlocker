name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装构建依赖
        run: pip install pyinstaller

      - name: Linux 安装 tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: 打包 CLI + GUI（PyInstaller）
        run: |
          python -m PyInstaller --clean --noconfirm --name finger_tool_cli --console finger_tool_cli.py
          python -m PyInstaller --clean --noconfirm --name finger_tool_gui --windowed finger_tool_gui.py

      - name: 压缩产物
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path finger_tool_cli,finger_tool_gui -DestinationPath m200f-${{ matrix.name }}.zip -Force"
          else
            zip -r m200f-${{ matrix.name }}.zip finger_tool_cli finger_tool_gui
          fi

      - name: 上传到 GitHub Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/m200f-${{ matrix.name }}.zip

      - name: 上传 Artifact（手动运行时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: m200f-${{ matrix.name }}
          path: dist/*
